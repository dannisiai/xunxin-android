name: Diagnose Android local startup
on:
  push:
    branches: [android-diagnostics]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SELF_HOSTED_MODE: "true"
      XUNXIN_ANDROID_BUILD: "1"
      XUNXIN_ANDROID_LOCAL: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build diagnostic APK
        run: |
          npm ci
          npm run build
          python3 scripts/prepare-xunxin-android.py
          python3 scripts/install-android-node.py --install-toolchain
          gradle -p android-shell assembleDebug
      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: xunxin-standalone-compiled
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on Android emulator
        timeout-minutes: 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            mkdir -p /tmp/xunxin-diagnostics
            adb logcat -c
            adb install -r android-shell/app/build/outputs/apk/debug/app-debug.apk > /tmp/xunxin-diagnostics/install.txt 2>&1
            adb shell am start -n app.floatphone.shell/.MainActivity > /tmp/xunxin-diagnostics/start.txt 2>&1
            sleep 90
            adb shell screencap -p /sdcard/before.png || true
            adb pull /sdcard/before.png /tmp/xunxin-diagnostics/before.png >/dev/null 2>&1 || true
            adb shell input tap 160 570
            sleep 20
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml /tmp/xunxin-diagnostics/window.xml >/dev/null 2>&1 || true
            adb shell screencap -p /sdcard/screen.png || true
            adb pull /sdcard/screen.png /tmp/xunxin-diagnostics/screen.png >/dev/null 2>&1 || true
            adb logcat -d -v threadtime > /tmp/xunxin-diagnostics/logcat.txt
            adb shell pidof app.floatphone.shell > /tmp/xunxin-diagnostics/pid.txt || true
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunxin-startup-debug-logs
          path: /tmp/xunxin-diagnostics/
          if-no-files-found: warn
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: xunxin-standalone-tested
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
