name: Build Xunxin standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SELF_HOSTED_MODE: "true"
      XUNXIN_ANDROID_BUILD: "1"
      XUNXIN_ANDROID_LOCAL: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install application dependencies
        run: npm ci
      - name: Build the bundled application
        run: npm run build
      - name: Package the application for Android
        run: python3 scripts/prepare-xunxin-android.py
      - name: Download Node.js Mobile
        run: python3 scripts/install-android-node.py --install-toolchain
      - name: Build Android APK
        run: gradle -p android-shell assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: xunxin-android-standalone-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="xunxin-android-v1.2.2-$GITHUB_SHA"
          gh release create "$release_tag" \
            "android-shell/app/build/outputs/apk/debug/app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Xunxin Android 1.2.2" \
            --notes "Standalone APK built from the latest local source. Commit: $GITHUB_SHA."
